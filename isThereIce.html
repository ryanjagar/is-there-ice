<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>Is There Ice?</title>

  <!-- <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script> -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link
    rel="stylesheet"
    href="styles.css"
  >



</head>

<body>
  <header>
    Daily Temps for The Previous 10 Days
  </header>


  <div id="app">


    <div class="chart-container">

      <canvas id="myChart"></canvas>
    </div>

    <ul
      class="data-warnings"
      v-if="warnings.length"
    >
      <li v-for="warning in warnings">{{ warning }}</li>
    </ul>

  </div>

  </div>
  <div class="chart-description">
    measured daily at midnight
  </div>
  <footer>
    &copy; 2023 Tilt Solutions Inc. All rights reserved.
  </footer>

  <script>
    const { createApp, ref, reactive, onMounted, nextTick } = Vue
    // stable, zero-padded, locale- and timezone-independent key; readings land
    // around 07:00 UTC (local midnight), so local dates would jitter across days
    const dayKey = (d) => {
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`;
    };


    // Ice Builds Temperature
    let iceBuildsTemp = -7
    // Ice Zone plugin - shows a shaded area below the temperature threshold
    const iceZone = {
      id: 'iceZone',
      beforeDatasetsDraw(chart, args, opts) {
        const { ctx, chartArea, scales: { y } } = chart;
        const threshold = opts.threshold ?? -7;
        const yPx = y.getPixelForValue(threshold);
        if (yPx > chartArea.bottom) return;         // threshold off-scale
        ctx.save();
        ctx.fillStyle = opts.color ?? 'rgba(101,154,213,0.25)';
        ctx.fillRect(
          chartArea.left, yPx,
          chartArea.right - chartArea.left,
          chartArea.bottom - yPx
        );
        ctx.restore();
      }
    };


    // WeatherData class to handle the weather data for each location
    class WeatherData {
      constructor(location) {
        this.location = location;
        this.fileName = location.fileName;
        this.chartData = null
      }
      async generateChartData() {
        const response = await fetch(this.fileName);
        const data = response.ok ? await response.json() : [];
        this.chartData = data.map((item) => {
          return { date: dayKey(new Date(item.dt * 1000)), time: item.dt * 1000, temp: item.main.temp };
        });
      }
      newestReading() {
        return Math.max(...this.chartData.map(item => item.time));
      }
      // one value per label, null where that day has no reading; if a day has
      // several readings the latest one wins
      tempsFor(labels) {
        const byDay = new Map(this.chartData.map(item => [item.date, item.temp]));
        return labels.map(day => byDay.get(day) ?? null);
      }
      place() {
        return this.location.name;
      }
      hexColour() {
        return this.location.hexcolour;
      }
    }


    const locations = [
      { name: 'Whitehorse', id: 6180550, fileName: 'whitehorseWeather.json', hexcolour: "#3373BA" },
      { name: "Toad River", id: 6170031, fileName: 'toadWeather.json', hexcolour: "#b7ba33" },
      { name: "Skagway", id: 5558953, fileName: 'skagwayWeather.json', hexcolour: "#ba3633" },
    ];

    const chartoptions = {
      tension: .25,
      responsive: true,
      spanGaps: false,
      scales: {
        x: {
          ticks: {
            minRotation: 45,
            maxRotation: 45,
          },
        },
        y: {
          suggestedMin: -10,
        },
      },
      plugins: {
        iceZone: { threshold: iceBuildsTemp },
      },
    };


    const days = 10;
    // readings land around 07:00 UTC daily; allow for late GitHub Actions runs
    const staleAfterHours = 30;

    // the `days` calendar days ending on `newest`, oldest first; the category
    // scale needs every label up front, so missing days stay in as gaps
    const dayWindow = (newest) => Array.from({ length: days }, (_, i) => {
      const d = new Date(newest);
      d.setUTCDate(d.getUTCDate() - (days - 1 - i));
      return dayKey(d);
    });

    // days missing everywhere get one line; the rest are listed per location
    const missingDayWarnings = (labels, datasets) => {
      const missingFor = (dataset) => labels.filter((_, i) => dataset.data[i] === null);
      const missingEverywhere = labels.filter((_, i) => datasets.every(ds => ds.data[i] === null));

      const lines = [];
      if (missingEverywhere.length) lines.push(`No readings for ${missingEverywhere.join(', ')}.`);

      for (const dataset of datasets) {
        const missing = missingFor(dataset).filter(day => !missingEverywhere.includes(day));
        if (missing.length === days) {
          lines.push(`${dataset.label}: no readings for the last ${days} days.`);
        } else if (missing.length) {
          lines.push(`${dataset.label}: no reading for ${missing.join(', ')}.`);
        }
      }
      return lines;
    };

    createApp({
      setup() {
        const warnings = ref([]);
        onMounted(async () => {
          const sources = [];
          for (const location of locations) {
            let x = new WeatherData(location);
            await x.generateChartData();
            sources.push(x);
          };

          const newest = Math.max(...sources.map(x => x.newestReading()));
          if (!Number.isFinite(newest)) {
            warnings.value = ['No temperature readings are available right now.'];
            return;
          }

          const labels = dayWindow(newest);

          const hoursOld = (Date.now() - newest) / 36e5;
          if (hoursOld > staleAfterHours) {
            warnings.value.push(`The newest reading is from ${dayKey(new Date(newest))}; the daily update may have stopped.`);
          }

          const datasets = sources.map((x) => ({
            label: x.place(),
            data: x.tempsFor(labels),
            backgroundColor: x.hexColour(),
            borderColor: x.hexColour(),
            borderWidth: 3
            // borderColor: 'rgba(75, 192, 192, 1)',
          }));

          warnings.value.push(...missingDayWarnings(labels, datasets));

          renderChart(labels, datasets);
        });

        const renderChart = (labels, datasets) => {

          const ctx = document.getElementById('myChart');
          new Chart(ctx, {
            plugins: [iceZone],
            type: 'line',

            data: {
              labels,
              datasets
            },
            options: chartoptions
          });


        }
        return {
          warnings
        }
      }
    }).mount('#app')
  </script>

</body>

</html>
